<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nayshi — En construction</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #0d1117;
      color: #e6edf3;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .card {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 40px 32px;
      max-width: 440px;
      width: 100%;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 12px;
      color: #58a6ff;
    }
    p {
      color: #8b949e;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .badge {
      display: inline-block;
      background-color: #238636;
      color: #ffffff;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
    }
    a {
      display: block;
      margin-top: 24px;
      color: #58a6ff;
      text-decoration: none;
      font-size: 0.9rem;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Nayshi</h1>
    <p>Le domaine <strong>nayshi.fr</strong> est bien relié à GitHub Pages. Le site arrive bientôt !</p>
    <span class="badge">● En ligne</span>
    <a href="https://github.com" target="_blank">Voir mon profil GitHub →</a>
  </div>
</body>
</html>
